<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>00 — Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }</style>
</head>
<body class="bg-gray-100 text-gray-800 text-sm">

<div class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm">

    <!-- App identity -->
    <div class="flex flex-col items-center mb-6">
      <div class="w-10 h-10 border border-gray-400 rounded mb-2"></div>
      <div class="font-semibold text-gray-700">Procurement</div>
      <div class="text-gray-400 text-xs">MK Themed Attractions Phils.</div>
    </div>

    <!-- Login card -->
    <div class="bg-white border border-gray-300 rounded p-6 space-y-4">
      <div>
        <h1 class="text-base font-semibold text-gray-900">Sign in</h1>
        <p class="text-gray-500 text-xs">Use your company email and password.</p>
      </div>

      <div>
        <label class="text-gray-500 text-xs block mb-1">Email</label>
        <div class="border border-gray-300 rounded px-3 py-2 text-gray-400">name@northfieldmfg.com</div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="text-gray-500 text-xs">Password</label>
          <span class="text-gray-400 text-xs hover:underline cursor-pointer">Forgot password?</span>
        </div>
        <div class="border border-gray-300 rounded px-3 py-2 text-gray-400">••••••••</div>
      </div>

      <div class="flex items-center gap-2 text-xs text-gray-500">
        <span class="w-4 h-4 border border-gray-400 rounded-sm inline-block"></span> Keep me signed in
      </div>

      <a href="01-application-layout.html" class="block text-center border border-gray-800 bg-gray-800 text-white rounded px-3 py-2 text-sm">Sign In</a>

      <div class="text-center text-gray-400 text-xs pt-1">
        Trouble signing in? Contact your Administrator.
      </div>
    </div>

    <div class="text-center text-gray-400 text-xs mt-4">© 2026 MK Themed Attractions Phils.</div>
  </div>
</div>

</body>
</html>
